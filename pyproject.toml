[project]
name = "research-harness"
version = "0.1.0"
description = "Discover research sources and build traceable, replayable data pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "filelock>=3.18,<4",
  "portalocker[win32]>=4.3,<5",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35.2,<2",
  "pydantic>=2.11,<3",
  "tldextract==5.3.2",
  "idna>=3.10,<4",
]

[project.scripts]
rh = "research_harness.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
