name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ordinary:
    name: Ordinary tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          python-version: "3.13.12"
      - run: uv sync --locked --extra mcp
      - run: uv run --locked --extra mcp ruff check src tests
      - run: uv run --locked --extra mcp ruff format --check src tests
      - name: Check evidence retention and legacy archive hashes
        run: uv run --locked --extra mcp python -m research_harness.evaluation.evidence_assets check-policy --repo . --policy examples/evaluation/evidence-policy.json
      - name: Test with visible optional-runtime skips
        run: uv run --locked --extra mcp pytest --tb=short --junitxml="${RUNNER_TEMP}/ordinary-tests.xml"

  runtime:
    name: Required Docker and Omnigent runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RH_TEST_REQUIRE_RUNTIME: "1"
      RH_TEST_STRATEGY_IMAGE: python@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          python-version: "3.13.12"
      - run: uv sync --locked --extra mcp
      - name: Install the pinned separate Omnigent environment
        run: sh examples/omnigent/setup.sh "${RUNNER_TEMP}/omnigent"
      - name: Pull the pinned strategy image
        run: docker pull "$RH_TEST_STRATEGY_IMAGE"
      - name: Install the separate Harbor environment
        run: |
          uv venv --python 3.12.12 "${RUNNER_TEMP}/harbor"
          uv pip install --python "${RUNNER_TEMP}/harbor/bin/python" -r examples/experiments/harbor-requirements.txt
      - name: Run all checks with skips forbidden
        env:
          RH_TEST_OMNIGENT_PYTHON: ${{ runner.temp }}/omnigent/.venv/bin/python
          RH_TEST_HARBOR_PYTHON: ${{ runner.temp }}/harbor/bin/python
        run: uv run --locked --extra mcp pytest --tb=short --junitxml="${RUNNER_TEMP}/runtime-tests.xml"
      - name: Check out the pinned experiment task
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: harbor-framework/terminal-bench-2
          ref: 2fd12b88aafdd04a52c298e3940bcb189f9766d6
          path: .researchharness/terminal-bench-2
          sparse-checkout: cancel-async-tasks
          persist-credentials: false
      - name: Verify delegated execution and inherited tool restrictions
        run: |
          uv run --locked --extra mcp python examples/experiments/omnigent_runtime_fixture.py \
            --checkout .researchharness/terminal-bench-2 \
            --out "${RUNNER_TEMP}/experiment-solution" \
            --harbor "${RUNNER_TEMP}/harbor/bin/harbor" \
            --omnigent-python "${RUNNER_TEMP}/omnigent/.venv/bin/python"
      - name: Verify candidate-authored rewards cannot change the independent score
        run: |
          uv run --locked --extra mcp python examples/experiments/omnigent_runtime_fixture.py \
            --fixture-inputs "${RUNNER_TEMP}/experiment-solution" \
            --out "${RUNNER_TEMP}/experiment-forged-reward" --forged-reward \
            --harbor "${RUNNER_TEMP}/harbor/bin/harbor" \
            --omnigent-python "${RUNNER_TEMP}/omnigent/.venv/bin/python"
      - name: Verify the editable program owns the model and tool loop
        run: |
          uv run --locked --extra mcp python examples/experiments/omnigent_runtime_fixture.py \
            --fixture-inputs "${RUNNER_TEMP}/experiment-solution" --program \
            --out "${RUNNER_TEMP}/experiment-program" \
            --harbor "${RUNNER_TEMP}/harbor/bin/harbor" \
            --omnigent-python "${RUNNER_TEMP}/omnigent/.venv/bin/python"
      - name: Verify the program cannot replace independent grading with a forged reward
        run: |
          uv run --locked --extra mcp python examples/experiments/omnigent_runtime_fixture.py \
            --fixture-inputs "${RUNNER_TEMP}/experiment-solution" --program --forged-reward \
            --out "${RUNNER_TEMP}/experiment-program-forged" \
            --harbor "${RUNNER_TEMP}/harbor/bin/harbor" \
            --omnigent-python "${RUNNER_TEMP}/omnigent/.venv/bin/python"
      - name: Verify the native Terminus-2 loop and persistent terminal
        run: |
          uv run --locked --extra mcp python examples/experiments/omnigent_runtime_fixture.py \
            --checkout .researchharness/terminal-bench-2 --terminus \
            --out "${RUNNER_TEMP}/experiment-terminus" \
            --harbor "${RUNNER_TEMP}/harbor/bin/harbor" \
            --omnigent-python "${RUNNER_TEMP}/omnigent/.venv/bin/python"
      - name: Verify independent grading for the Terminus-2 program
        run: |
          uv run --locked --extra mcp python examples/experiments/omnigent_runtime_fixture.py \
            --fixture-inputs "${RUNNER_TEMP}/experiment-terminus" --terminus --forged-reward \
            --out "${RUNNER_TEMP}/experiment-terminus-forged" \
            --harbor "${RUNNER_TEMP}/harbor/bin/harbor" \
            --omnigent-python "${RUNNER_TEMP}/omnigent/.venv/bin/python"
      - name: Retain experiment diagnostics, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experiment-runtime-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/experiment-solution/
            ${{ runner.temp }}/experiment-forged-reward/
            ${{ runner.temp }}/experiment-program/
            ${{ runner.temp }}/experiment-program-forged/
            ${{ runner.temp }}/experiment-terminus/
            ${{ runner.temp }}/experiment-terminus-forged/
            !${{ runner.temp }}/experiment-*/execution/controller/*/runtime-data/**
            !${{ runner.temp }}/experiment-*/execution/controller/*/runtime-config/**
            !${{ runner.temp }}/experiment-*/execution/controller/*/workspace-connection.json
