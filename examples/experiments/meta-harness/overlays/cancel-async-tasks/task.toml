# Research Harness adaptation of Terminal-Bench cancel-async-tasks by Alex Shaw.
# Changes: separate verifier, explicit artifact, pinned build recipe,
# and smaller local memory reservation. Original tests and solution are unchanged.
schema_version = "1.4"
artifacts = ["/app/run.py"]

[task]
name = "terminal-bench/cancel-async-tasks"
description = "Async concurrency and cancellation cleanup, including queued tasks."
authors = [{name = "Alex Shaw", email = "alexgshaw64@gmail.com"}]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240
gpus = 0
network_mode = "public"
